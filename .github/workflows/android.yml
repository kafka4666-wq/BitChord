name: Android Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-prod-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Prepare signing and local properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required GitHub Actions signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks
          keytool -list -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=bitchord-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build and test signed production APK
        run: ./gradlew :app:testProdReleaseUnitTest :app:assembleProdRelease

      - name: Stage universal APK
        id: stage-apk
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*bitchordVersionName.*= "\([^"]*\)".*/\1/p' build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read bitchordVersionName from build.gradle.kts" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v$VERSION" >&2
            exit 1
          fi
          APK="$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle did not produce a universal APK" >&2
            find app/build/outputs/apk/prod/release -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          mkdir -p dist
          OUTPUT="dist/BitChord-v${VERSION}-universal.apk"
          cp "$APK" "$OUTPUT"
          echo "apk_path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify fork package ID
        env:
          APK_PATH: ${{ steps.stage-apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "Android SDK build-tools were not found for application ID verification" >&2
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "aapt was not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK_PATH" > /tmp/BitChord-apk-badging.txt
          ACTUAL_ID="$(awk -F"'" '/^package: name=/{print $2; exit}' /tmp/BitChord-apk-badging.txt)"
          EXPECTED_ID="com.music.bitchord.fork"
          printf 'APK application ID: %s\nExpected application ID: %s\n' "$ACTUAL_ID" "$EXPECTED_ID"
          if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
            echo "Universal APK does not use the fork package ID" >&2
            exit 1
          fi

      - name: Verify universal APK signature
        env:
          APK_PATH: ${{ steps.stage-apk.outputs.apk_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "Android SDK build-tools were not found for apksigner verification" >&2
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner was not found in Android SDK build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH" > /tmp/BitChord-apk-signature.txt 2>&1
          cat /tmp/BitChord-apk-signature.txt
          ACTUAL_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: *([[:xdigit:]:]+).*/\1/p' /tmp/BitChord-apk-signature.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          keytool -exportcert -keystore bitchord-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -file /tmp/BitChord-release-cert.der >/dev/null
          EXPECTED_SHA256="$(sha256sum /tmp/BitChord-release-cert.der | awk '{print tolower($1)}')"
          printf 'APK signer SHA-256: %s\nExpected key SHA-256: %s\n' "$ACTUAL_SHA256" "$EXPECTED_SHA256"
          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Universal APK signer does not match the configured release keystore" >&2
            exit 1
          fi
          echo "Verified APK signer SHA-256: $ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-v${{ steps.stage-apk.outputs.version }}-universal
          path: ${{ steps.stage-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.stage-apk.outputs.apk_path }}" --verify-tag --title "BitChord $GITHUB_REF_NAME" --generate-notes
